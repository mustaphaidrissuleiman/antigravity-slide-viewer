<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.35" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />

  <!-- Presentation Screen Board -->
  <g filter="url(#dropGlow)">
    <rect x="10" y="11" width="44" height="30" rx="3.5" fill="url(#screenGrad)" />
    
    <!-- Header / Title bar in Slide -->
    <rect x="14" y="15" width="18" height="3" rx="1.5" fill="#8B5CF6" />
    
    <!-- Subtitle bar -->
    <rect x="14" y="21" width="11" height="2" rx="1" fill="#94A3B8" />

    <!-- Slide Content Chart Graphic -->
    <!-- Bar 1 -->
    <rect x="30" y="27" width="4" height="9" rx="1" fill="#C084FC" />
    <!-- Bar 2 -->
    <rect x="36" y="23" width="4" height="13" rx="1" fill="#8B5CF6" />
    <!-- Bar 3 -->
    <rect x="42" y="18" width="4" height="18" rx="1" fill="#3B82F6" />
    <line x1="28" y1="36" x2="48" y2="36" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Bullet lines on the left -->
    <circle cx="15.5" cy="27" r="1.5" fill="#8B5CF6" />
    <rect x="19" y="26" width="7" height="2" rx="1" fill="#64748B" />
    <circle cx="15.5" cy="32" r="1.5" fill="#8B5CF6" />
    <rect x="19" y="31" width="6" height="2" rx="1" fill="#64748B" />
  </g>

  <!-- Presentation Stand / Easel Legs -->
  <path d="M32 41 L32 51" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M22 53 L32 50 L42 53" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
